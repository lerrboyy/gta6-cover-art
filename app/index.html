<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vice Panels turns your photos into multi-panel GTA-style cover art with a caption band and PNG export.">
  <title>Vice Panels - GTA-Style Cover Art Maker</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <section class="controls">
      <h1>Vice Panels</h1>
      <p>Three panels, one photo or three, a caption, and a PNG to post.</p>
      
      <label>Panel 1 photo
        <input id="photo0" type="file" accept="image/*">
      </label>
      <label>Panel 2 photo
        <input id="photo1" type="file" accept="image/*">
      </label>
      <label>Panel 3 photo
        <input id="photo2" type="file" accept="image/*">
      </label>
      
      <button id="fillall" type="button">Fill all panels with Panel 1</button>
      
      <label>Caption
        <input id="caption" type="text" maxlength="40" value="Sunset Heist">
      </label>
      
      <label>Size
        <select id="size">
          <option value="square">Square 1080 x 1080</option>
          <option value="portrait">Portrait 1080 x 1350</option>
          <option value="landscape">Landscape 1920 x 1080</option>
        </select>
      </label>
      
      <label>Grade
        <select id="grade">
          <option value="sunset">Sunset</option>
          <option value="neon">Neon</option>
        </select>
      </label>
      
      <label>Zoom panel 1
        <input id="zoom0" type="range" min="1" max="2" step="0.05" value="1">
      </label>
      <label>Zoom panel 2
        <input id="zoom1" type="range" min="1" max="2" step="0.05" value="1">
      </label>
      <label>Zoom panel 3
        <input id="zoom2" type="range" min="1" max="2" step="0.05" value="1">
      </label>
      
      <button id="export" type="button">Export PNG</button>
      
      <p id="status" role="status"></p>
    </section>
    
    <canvas id="cover" width="1080" height="1080"></canvas>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
